# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
include:
  # Corne left = central half — adds raw_hid_adapter + studio-rpc-usb-uart
  # snippet so KeyPeek can read live layer state over USB. Peripheral
  # (right) needs neither.
  - board: nice_nano//zmk
    shield: corne_left raw_hid_adapter
    # test/central-fix-rgbon: studio snippet dropped (protoc absent in CI); KeyPeek off for this controller-fix test only
  - board: nice_nano//zmk
    shield: corne_right
  - board: nice_nano@1//zmk
    shield: murphpad
