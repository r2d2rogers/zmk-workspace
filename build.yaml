# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
include:
  # Corne left = central half — adds raw_hid_adapter + studio-rpc-usb-uart
  # snippet so KeyPeek can read live layer state over USB. Peripheral
  # (right) needs neither.
  - board: nice_nano//zmk
    shield: corne_left raw_hid_adapter
    snippet: studio-rpc-usb-uart
  - board: nice_nano//zmk
    shield: corne_right
  - board: nice_nano@1//zmk
    shield: murphpad

  # backkb — S24U back-of-phone split, 32-key + EC11 encoders + analog sticks.
  # Shield ships v1-style board strings; both syntaxes build fine.
  - board: nice_nano_v2
    shield: backkb_left
  - board: nice_nano_v2
    shield: backkb_right
  - board: nice_nano_v2
    shield: settings_reset
