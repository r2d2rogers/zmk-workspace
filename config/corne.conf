CONFIG_ZMK_KEYBOARD_NAME="corne-royal"

# Uncomment the following line to enable the Corne RGB Underglow
# DEFINITIVE RGB test (Item #3421): subsystem fully OFF. Unlike BRT=0, this stops the WS2812
# frame transmit entirely — removes BOTH the power draw AND the interrupt-disabled bit-bang
# window that can starve the BLE/USB stack → stall (the non-power path that survives on USB).
# Holds with no hang → RGB-driver-timing confirmed → fix = SPI/EasyDMA WS2812 driver (keeps
# RGB, no interrupt lockout) or fewer LEDs/static effect. Still hangs → RGB exonerated, move
# to the BLE/USB host witnesses. OLED (DISPLAY) left ON. RGB-only delta off main.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n  # boot with RGB toggled OFF (update-work idle) — buildable RGB-off soak; =n broke &rgb_ug keymap binds

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Set sleep timeout to 30min (30*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# power saving features
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_PM_SOFT_OFF=y

# Enable mouse
CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Combo config, automated by build script
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=6
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3

# Bluetooth tweaks

# Additional profiles for bluetooth connections
CONFIG_BT_MAX_CONN=10
CONFIG_BT_MAX_PAIRED=11

# Uncomment the following line to boost the bluetooth trasmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ZMK Studio — required by KeyPeek for live layer-state overlay (USB connection
# to the central half). Layout + keymap stream from device, no host-side config.
CONFIG_ZMK_STUDIO=n
