CONFIG_ZMK_KEYBOARD_NAME="corne-royal"

# Uncomment the following line to enable the Corne RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y

# PERMANENT FIX candidate (Item #3421 brownout): HARD-cap underglow max brightness so the
# WS2812 current can't reach the sag that browns out the nRF52840. BRT_MAX is a real ceiling
# (not just a boot value) — the brightness-up key can't exceed it. 30% keeps RGB clearly
# visible at <1/3 full current. BRT_START defaults to BRT_MAX, so it boots at the cap.
# TUNE after the BRT=0 soak (soak/rgb-brt0-brownout) confirms brownout: bisect the highest
# safe ceiling. Pairs with, does not replace, that diagnostic soak.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=30

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Set sleep timeout to 30min (30*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# power saving features
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_PM_SOFT_OFF=y

# Enable mouse
CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Combo config, automated by build script
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=6
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3

# Bluetooth tweaks

# Additional profiles for bluetooth connections
CONFIG_BT_MAX_CONN=10
CONFIG_BT_MAX_PAIRED=11

# Uncomment the following line to boost the bluetooth trasmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ZMK Studio — required by KeyPeek for live layer-state overlay (USB connection
# to the central half). Layout + keymap stream from device, no host-side config.
CONFIG_ZMK_STUDIO=y
