# ===== backkb shield config (both halves) =====

# --- Power / BLE ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Pointer / mouse (thumbstick mouse mode, scroll) ---
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_INPUT=y

# --- Analog input driver (thumbstick) ---
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ANALOG_INPUT=y
# Uncomment to debug raw/post-processed stick values over USB:
# CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y
# CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y
# CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=y

# --- HID-IO: second HID interface for GAMEPAD mode ---
# Only required if you use the gamepad layer. Safe to leave enabled.
CONFIG_ZMK_HID_IO=y
CONFIG_ZMK_HID_IO_JOYSTICK=y
# Over USB you also need a 2nd HID device:
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID_DEVICE_COUNT=2

# --- Encoder (scroll wheel) ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# NOTE on battery: the analog driver polls the ADC continuously, so
# untethered runtime is reduced. This rig is intended to run USB-tethered
# most of the time. To save power off-tether, the keymap gates pointer use
# behind the MOUSE/SCROLL/GAMEPAD layers; idle on the base layer lets the
# MCU sleep normally.
