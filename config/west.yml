# This file specifies the build dependencies for Github Action workflows and
# for local build environments. The workspace has four toplevel directories
# containing the user config, modules, zephy and ZMK.
#
# ZMK-Workspace
# ├── config
# ├── modules
# ├── zephyr
# └── zmk
#
# To create a local build environment, clone this repository and then run the
# following commands from its toplevel directory:
#
# $ west init -l config
# $ west update
# $ west zephyr-export
#
---
manifest:
  defaults:
    remote: urob
    revision: v0.3 # Pin everything to v0.3

  remotes:
    - name: urob
      url-base: https://github.com/urob
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: 8feeb52eafc716c1697cfe0515e98b78281c3543 # main-2026/03/09
      import: app/west.yml

    # ZMK modules
    # All modules pinned to main — v0.3 tags predate ZMK v0.4 API changes
    - name: zmk-adaptive-key
      path: modules/zmk/adaptive-key
      revision: main
    - name: zmk-auto-layer
      path: modules/zmk/auto-layer
      revision: main
    - name: zmk-helpers
      path: modules/zmk/helpers
      revision: main
    - name: zmk-leader-key
      path: modules/zmk/leader-key
      revision: main
    - name: zmk-tri-state
      path: modules/zmk/tri-state
      revision: main
    - name: zmk-unicode
      path: modules/zmk/unicode
      revision: main

    # Only source necessary Zephyr modules. Remove this entire section to restore
    # the default (needed for less common hardware).
    - name: zephyr
      remote: zmkfirmware
      revision: v4.1.0+zmk-fixes
      clone-depth: 1
      import:
        name-allowlist:
          - cmsis
          - hal_nordic
          - hal_rpi_pico
          - hal_stm32
          - mbedtls
          - tinycrypt

  self:
    path: config
